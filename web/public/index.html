<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kairo Web</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b0d10; color: #e9edf3; }
    body { margin: 0; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 230px 1fr; }
    aside { padding: 20px; background: #11151a; border-right: 1px solid #29323a; }
    h1 { margin: 0 0 4px; color: #8bd5ca; }
    nav button { display: block; width: 100%; margin: 8px 0; padding: 10px 12px; background: #171c22; border: 1px solid #303944; color: #cad3df; text-align: left; }
    nav button.active { background: #8bd5ca; color: #071012; }
    main { min-width: 0; display: grid; grid-template-rows: auto 1fr auto; }
    header, footer { display: flex; gap: 12px; align-items: center; padding: 14px 18px; background: #0f1318; border-bottom: 1px solid #29323a; }
    .meta { margin-left: auto; min-width: 260px; }
    progress { width: 100%; accent-color: #8bd5ca; }
    .panel { margin: 18px; padding: 16px; overflow: auto; background: #10151b; border: 1px solid #29323a; }
    .grid { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
    textarea { flex: 1; min-height: 72px; resize: vertical; color: #e9edf3; background: #0b0d10; border: 1px solid #3a4652; padding: 10px; }
    footer { border-top: 1px solid #29323a; border-bottom: 0; }
    footer button { padding: 10px 16px; border: 1px solid #3a4652; background: #171c22; color: #e9edf3; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .muted { color: #9aa6b2; }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>KAIRO</h1>
      <p class="muted" id="version">0.3.0-preview</p>
      <nav id="tabs"></nav>
    </aside>
    <main>
      <header>
        <div><strong id="profile">Loading...</strong><div class="muted" id="workspace"></div></div>
        <div class="meta"><span id="contextText">0%</span><progress id="context" value="0" max="1"></progress></div>
      </header>
      <section id="content" class="panel"></section>
      <footer id="composer">
        <textarea id="message" placeholder="Ask Kairo..."></textarea>
        <button id="send">Send</button>
        <button id="stop">Stop</button>
      </footer>
    </main>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get("token") || "";
    const tabs = ["chat", "workspace", "settings", "sessions", "doctor"];
    let active = "chat";
    let events = [];
    const qs = (id) => document.getElementById(id);
    const url = (path) => path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token);
    async function api(path, options = {}) {
      const res = await fetch(url(path), { ...options, headers: { "content-type": "application/json", ...(options.headers || {}) } });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    function renderTabs() {
      qs("tabs").innerHTML = tabs.map(tab => `<button class="${tab === active ? "active" : ""}" data-tab="${tab}">${tab}</button>`).join("");
      qs("tabs").querySelectorAll("button").forEach(btn => btn.onclick = () => { active = btn.dataset.tab; render(); });
      qs("composer").style.display = active === "chat" ? "flex" : "none";
    }
    function setStatus(status) {
      qs("version").textContent = status.version || "0.3.0-preview";
      qs("profile").textContent = status.profile || "No profile";
      qs("workspace").textContent = status.workspace_root || "";
      qs("context").value = status.context?.used || 0;
      qs("context").max = status.context?.limit || 1;
      qs("contextText").textContent = `${Math.round(status.context?.percent || 0)}% context`;
    }
    async function render() {
      renderTabs();
      if (active === "chat") {
        qs("content").innerHTML = events.map(e => `<pre>${e.kind}: ${escapeHtml(JSON.stringify(e.payload))}</pre>`).join("");
      } else if (active === "workspace") {
        const s = await api("/api/workspace/snapshot");
        qs("content").outerHTML = `<section id="content" class="grid"><div class="panel"><h2>Files</h2>${s.files.slice(0, 200).map(escapeHtml).join("<br>")}</div><div class="panel"><h2>Diff</h2><pre>${escapeHtml(s.diff || "")}</pre></div></section>`;
      } else if (active === "settings") {
        const c = await api("/api/config");
        qs("content").outerHTML = `<section id="content" class="panel"><h2>Settings</h2><pre>${escapeHtml(JSON.stringify(c, null, 2))}</pre></section>`;
      } else if (active === "sessions") {
        const s = await api("/api/sessions");
        qs("content").outerHTML = `<section id="content" class="panel"><h2>Sessions</h2>${s.sessions.map(x => `<p>${escapeHtml(x.name)} - ${x.message_count} messages</p>`).join("")}</section>`;
      } else {
        qs("content").outerHTML = `<section id="content" class="panel"><button id="doctorRun">Run Doctor</button><pre id="doctorOut"></pre></section>`;
        qs("doctorRun").onclick = async () => { qs("doctorOut").textContent = JSON.stringify(await api("/api/doctor", { method: "POST", body: JSON.stringify({ local_only: true }) }), null, 2); };
      }
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    qs("send").onclick = async () => {
      const text = qs("message").value.trim();
      if (!text) return;
      await api("/api/chat", { method: "POST", body: JSON.stringify({ message: text }) });
      qs("message").value = "";
    };
    qs("stop").onclick = () => api("/api/chat/stop", { method: "POST" });
    api("/api/status").then(setStatus).then(render);
    const ws = new WebSocket(`${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/api/events?token=${encodeURIComponent(token)}`);
    ws.onmessage = (message) => {
      const event = JSON.parse(message.data);
      if (event.kind === "status") setStatus(event.payload);
      events = events.concat(event).slice(-300);
      if (active === "chat") render();
    };
  </script>
</body>
</html>
