name: Kairo Kernel CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/kernel --cov=kairo_kernel --cov-report=term-missing
      - run: python -m ruff check kairo_kernel tests/kernel
      - run: python -m mypy kairo_kernel

  alpha-wheel:
    name: Alpha wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: KAIRO_WHEEL=dist/kairo_kernel-0.4.0a1-py3-none-any.whl python -m pytest tests/kernel/packaging
      - run: python -m pip_audit .
