[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-kernel"
dynamic = ["version"]
description = "Frontend-neutral kernel for the Kairo agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.22.1,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
openai = ["openai>=2.46,<3"]
anthropic = ["anthropic>=0.117,<1"]
mcp = ["mcp>=2,<3"]
otel = [
    "opentelemetry-api>=1.31,<2",
    "opentelemetry-sdk>=1.31,<2",
    "opentelemetry-exporter-otlp>=1.31,<2",
]
all = [
    "openai>=2.46,<3",
    "anthropic>=0.117,<1",
    "mcp>=2,<3",
    "opentelemetry-api>=1.31,<2",
    "opentelemetry-sdk>=1.31,<2",
    "opentelemetry-exporter-otlp>=1.31,<2",
]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<1",
    "mypy>=1.10,<3",
    "build>=1.2,<2",
    "twine>=6,<7",
    "pip-audit>=2.9,<3",
]

[tool.setuptools.dynamic]
version = {attr = "kairo_kernel._version.__version__"}

[tool.setuptools.packages.find]
include = ["kairo_kernel", "kairo_kernel.*"]
exclude = ["agent*", "tools*", "tests*", "web*"]
namespaces = false

[tool.setuptools.package-data]
kairo_kernel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/kernel"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["kairo_kernel"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "UP017", "UP042"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "^.venv/",
    "^.git/",
]
