[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-tui"
dynamic = ["version"]
description = "Textual TUI frontend for the Kairo agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "textual>=8.2,<9",
    "rich>=14,<15",
    "keyring>=25,<26",
    "platformdirs>=4,<5",
    "kairo-kernel==0.4.0a2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.15,<1",
    "mypy>=1.10,<3",
    "build>=1.2,<2",
]

[project.scripts]
kairo-tui = "kairo_tui.cli:main"
kairo = "kairo_tui.cli:main"

[tool.setuptools.dynamic]
version = {attr = "kairo_tui._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["kairo_tui", "kairo_tui.*", "kairo_tui_v2", "kairo_tui_v2.*"]
namespaces = false

[tool.setuptools.package-data]
kairo_tui = ["py.typed"]
kairo_tui_v2 = ["theme.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_v2"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "UP017", "UP042"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
